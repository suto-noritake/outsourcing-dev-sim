<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ABMインタラクティブダッシュボード</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; color: #111827; }
    h1, h2 { margin: 0 0 12px; }
    .panel { border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-bottom: 14px; background: #fafafa; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
    label { display: flex; flex-direction: column; font-size: 12px; gap: 4px; }
    .field-label { font-weight: 600; }
    .field-label small { font-weight: 400; color: #6b7280; }
    input, select, button { padding: 6px; font-size: 13px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .summary-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .strategy-card { border: 1px solid #d1d5db; border-radius: 8px; padding: 10px; background: #fff; }
    .metric-item { margin-top: 8px; border-top: 1px dashed #e5e7eb; padding-top: 8px; }
    .metric-label { font-size: 13px; font-weight: 600; }
    .metric-label small { font-weight: 400; color: #6b7280; }
    .metric-value { font-size: 18px; margin-top: 2px; }
    .metric-help { font-size: 12px; color: #4b5563; margin-top: 2px; line-height: 1.45; }
    .error { color: #b91c1c; white-space: pre-wrap; margin-top: 8px; }
    .small { font-size: 12px; color: #6b7280; line-height: 1.5; }
    .chart-container { position: relative; height: 400px; width: 100%; }
    .chart-container canvas { max-height: none; }
    .axis-help { margin: 10px 0 8px; padding: 8px; border-radius: 6px; background: #eef2ff; font-size: 12px; line-height: 1.5; }
    .quadrant-legend { margin-top: 8px; display: grid; gap: 6px; }
    .quadrant-item { border: 1px solid #e5e7eb; border-radius: 6px; background: #fff; padding: 8px; font-size: 12px; line-height: 1.45; }
    .quadrant-title { font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 999px; }
    @media (max-width: 480px) {
      .chart-container { height: 280px; }
    }
  </style>
</head>
<body>
  <h1>ABMインタラクティブダッシュボード</h1>

  <div class="panel">
    <h2>シミュレーション条件</h2>
    <form id="sim-form">
      <div class="grid">
        <label title="同じ案件に投入する人数を増やしたとき、技術力がどれだけ伸びるかを左右します。値が1に近いほど人数を増やした分だけ素直に技術力が伸び、0に近いほど人数を増やしても頭打ちになりやすくなります（3人目・4人目の追加効果が薄い）。">
          <span class="field-label">エージェント人数投入の効き目 <small>(alpha)</small></span>
          <input type="number" step="0.01" name="alpha" />
        </label>
        <label title="技術力が案件の難易度を上回っているかどうかで、成功・失敗がどれくらいハッキリ決まるかを表します。値が大きいほど「技術力が難易度を上回っていればほぼ確実に成功、下回っていればほぼ確実に失敗」という結果になり、僅差の逆転が起きにくくなります。値を上げても成功率そのものが下がるわけではありません。">
          <span class="field-label">成功・失敗の白黒のつきやすさ <small>(beta)</small></span>
          <input type="number" step="0.01" name="beta" />
        </label>
        <label title="クライアントがB社に持つ信頼度を、直近の成功/失敗とこれまでの実績のどちらを重視して更新するかを表します。値が大きいほど信頼度はゆっくりとしか動かず（1回の失敗で急落しない代わり挽回にも時間がかかる）、値が小さいほど直近の結果に敏感に上下します。">
          <span class="field-label">信頼度（評判）の変わりやすさ <small>(lam)</small></span>
          <input type="number" step="0.01" name="lam" />
        </label>
        <label title="案件をこなすたびにかかる費用全体の水準を決める基礎係数です。技術力には影響せず、純粋に「同じ仕事にいくらかかるか」だけを底上げします。値が大きいほど同じ案件でもコストが高くつき、資金の減りが早くなります。">
          <span class="field-label">コストの基準倍率 <small>(k1)</small></span>
          <input type="number" step="0.01" name="k1" />
        </label>
        <label title="より高性能なモデル（Low→Mid→High→Frontier）を使うほど、コストがどれだけ急激に高くなるかを表す指数です。値が大きいほど「高性能ほど性能の伸び以上にコストが跳ね上がる」傾向が強まり、値が小さいほど高性能モデルでも比較的割安に使えます。">
          <span class="field-label">高性能モデルの割高さ <small>(cost_curve_exponent)</small></span>
          <input type="number" step="0.01" name="cost_curve_exponent" />
        </label>
        <label title="毎ラウンドのコストや所要時間について、見積もりからどれだけ実績がブレるかを表します。値が大きいほど、同じ条件でも実際の費用・時間が予想より大きく上下しやすくなります。成功・失敗の判定そのものには影響しません。">
          <span class="field-label">コスト・工数の見積もりのブレ <small>(sigma_noise)</small></span>
          <input type="number" step="0.01" name="sigma_noise" />
        </label>
        <label title="B社が案件に成功するたびに、クライアントが「次はもっと難しい仕事を」と要求難易度をどれだけ引き上げてくるかを表します。値が大きいほど成功のたびに難易度が急激に上がり、やがて技術力が追いつかなくなるリスクが高まります。B社自身の成長速度ではなく、クライアント側の「欲張り度」を表す値です。">
          <span class="field-label">クライアントの要求エスカレーション率 <small>(gamma)</small></span>
          <input type="number" step="0.01" name="gamma" />
        </label>
        <label title="案件が失敗に終わった場合に限り、クライアントが契約予算の何割かを支払ってくれるかを表す割合（0〜1）です。0なら失敗した回の支払いは一切なく、1に近いほど失敗しても収入があるため資金への打撃が和らぎます。">
          <span class="field-label">失敗時の補填払い率 <small>(partial_pay)</small></span>
          <input type="number" step="0.01" name="partial_pay" />
        </label>
        <label title="クライアントが持つB社への信頼度（0〜1）がこの値を下回ると、クライアントは即座に契約を打ち切ります。値が大きいほど少しの信頼低下でも契約解除されやすく（基準が厳しい）、値が小さいほど信頼が多少下がっても契約が続きやすくなります（基準が緩い）。支払われる報酬額とは無関係です。">
          <span class="field-label">契約打ち切りの信頼度ライン <small>(r_min)</small></span>
          <input type="number" step="0.01" name="r_min" />
        </label>
        <label title="案件に何回連続で失敗すると、クライアントが見切りをつけて契約を打ち切るかを表す回数です。値が大きいほど連続失敗にも猶予がありますが、値が小さいと少しのつまずきですぐ契約解除につながります。">
          <span class="field-label">連続失敗の我慢の限度 <small>(max_consecutive_failures)</small></span>
          <input type="number" step="1" name="max_consecutive_failures" />
        </label>
        <label title="シミュレーション開始時点で発注される案件の難易度です。序盤の技術力とのバランスが、最初の成功しやすさを左右します。">
          <span class="field-label">開始時点の案件の難易度 <small>(difficulty_0)</small></span>
          <input type="number" step="0.01" name="difficulty_0" />
        </label>
        <label title="B社が事業を始める時点で持っている運転資金です（目安：中規模案件およそ10件分に相当）。この資金がなくなると倒産としてシミュレーションが終了します。">
          <span class="field-label">開始時点の手持ち資金 <small>(funds_0)</small></span>
          <input type="number" step="0.01" name="funds_0" />
        </label>
        <label title="クライアントの要求エスカレーション（gamma）によって難易度が際限なく上がり続けないよう設ける上限値です。難易度はこの値を超えて上がりません。">
          <span class="field-label">難易度の上限 <small>(difficulty_cap)</small></span>
          <input type="number" step="0.01" name="difficulty_cap" />
        </label>
        <label title="クライアントがB社に支払う契約予算（報酬）のうち、案件の難易度に関係なく常に上乗せされる固定部分の金額です。値が大きいほど、簡単な案件でも一定額の報酬が保証されます。">
          <span class="field-label">契約予算の基本額 <small>(budget_c0)</small></span>
          <input type="number" step="0.01" name="budget_c0" />
        </label>
        <label title="契約予算（報酬）のうち、案件の難易度とB社の評判に応じて増減する部分の大きさを決める係数です。値が大きいほど、難しい案件・評判が良い状態であるほど報酬が大きく積み増されます（評判が低いと上乗せ分は最大でも半分程度に割り引かれます）。">
          <span class="field-label">難易度連動の予算係数 <small>(budget_c1)</small></span>
          <input type="number" step="0.01" name="budget_c1" />
        </label>
        <label title="倒産も契約打ち切りもせずに生き残れた場合の、最大継続ラウンド数です。この回数に達して終了した場合は「生き残り切った」という扱いで、悪い結果ではありません。">
          <span class="field-label">1回のシミュレーションの最大ラウンド数 <small>(max_rounds)</small></span>
          <input type="number" step="1" name="max_rounds" />
        </label>
        <label title="B社が毎ラウンド、どの性能のモデルを何人分投入するかを決める行動方針です。conservative（保守的）は成功最優先、cost_optimal（コスト最適）は資金温存優先、adaptive（適応型）は資金残量や直近成績に応じて方針を切り替えます。">
          <span class="field-label">B社の投資方針 <small>(strategy)</small></span>
          <select name="strategy">
            <option value="adaptive">適応型 (adaptive)</option>
            <option value="conservative">保守的 (conservative)</option>
            <option value="cost_optimal">コスト最適 (cost_optimal)</option>
          </select>
        </label>
        <label title="同じ設定で「運（乱数）」だけを変えて何回シミュレーションを繰り返すか（1〜500）です。回数を増やすほど、成功率などの平均値の信頼性が上がります。">
          <span class="field-label">試行回数 <small>(n_trials)</small></span>
          <input type="number" step="1" name="n_trials" />
        </label>
        <label title="シミュレーションの「運」を決める乱数の出発点となる整数値です。同じbase_seedと設定であれば、何度実行しても全く同じ結果が再現されます（比較実験の再現性確保用）。">
          <span class="field-label">乱数の開始番号 <small>(base_seed)</small></span>
          <input type="number" step="1" name="base_seed" />
        </label>
      </div>
      <div class="actions">
        <button type="button" id="baseline-btn">初期値に戻す</button>
        <button type="button" id="run-btn">シミュレーション実行</button>
        <button type="button" id="compare-btn">3戦略を比較</button>
      </div>
      <p class="small">比較モードでは戦略の選択は無視され、保守的・コスト最適・適応型の3戦略をまとめて実行します。</p>
      <div id="error" class="error"></div>
    </form>
  </div>

  <div class="panel">
    <h2>集計結果サマリー</h2>
    <div id="summary" class="summary-grid"></div>
  </div>

  <div class="panel">
    <h2>四象限散布図（技術優位度 vs 資金体力）</h2>
    <div class="chart-container">
      <canvas id="scatter-chart"></canvas>
    </div>
    <div class="axis-help">
      <div><strong>X軸（技術優位度 / capability_margin）</strong>: 技術力 − 案件の難易度。プラスほど技術が難易度を上回っています。</div>
      <div><strong>Y軸（資金体力 / funding_runway）</strong>: 資金残高 ÷ 直近の資金消費ペース。今のペースであと何ラウンド持つかの目安です。</div>
    </div>
    <div id="quadrant-legend" class="quadrant-legend"></div>
  </div>

  <div class="panel">
    <h2>生存ラウンド数ヒストグラム</h2>
    <div class="chart-container">
      <canvas id="hist-chart"></canvas>
    </div>
  </div>

  <script>
    const defaults = {
      alpha: 0.6, beta: 3.0, lam: 0.7, k1: 1.0, cost_curve_exponent: 2.0, sigma_noise: 0.3,
      gamma: 0.15, partial_pay: 0.0, r_min: 0.4, max_consecutive_failures: 3,
      difficulty_0: 1.0, funds_0: 100.0, difficulty_cap: 20.0, budget_c0: 5.0, budget_c1: 15.0,
      max_rounds: 200, strategy: "adaptive", n_trials: 100, base_seed: 0
    };
    const strategyOrder = ["conservative", "cost_optimal", "adaptive"];
    const STRATEGY_LABEL_JA = {
      conservative: "保守的",
      cost_optimal: "コスト最適",
      adaptive: "適応型"
    };
    const QUADRANT_LABEL_JA = {
      dominant_leader: "①独走勝ち組型",
      cash_starved_specialist: "②宝の持ち腐れ／燃え尽き型",
      deep_pockets_shallow_skills: "③物量型／時間稼ぎ型",
      exit_candidate: "④淘汰予備軍型"
    };
    const METRIC_META = {
      success_rate: {
        label: "成功割合",
        help: "案件をこなせた（成功に終わった）割合の平均。高いほど着実に契約を継続できています。"
      },
      bankruptcy_rate: {
        label: "倒産割合",
        help: "資金が尽きて倒産に至った試行の割合。高いほど資金繰りが破綻しやすい設定・戦略です。"
      },
      mean_survival_rounds: {
        label: "平均取引継続ラウンド数",
        help: "倒産・契約打ち切りになるまで、平均で何ラウンド取引が続いたか。上限（max_rounds）に近いほど長期的な関係を維持できています。"
      },
      mean_net_profit: {
        label: "平均純利益",
        help: "受け取った報酬合計からコスト合計を差し引いた、平均的な最終的な儲け。マイナスは平均して赤字であることを意味します。"
      }
    };
    const QUADRANT_DETAILS = {
      dominant_leader: {
        meaning: "技術優位度・資金体力ともに高い状態。案件が難化しても勝ち続けられる、最も理想的なポジション。",
        implication: "攻めの投資・案件拡大を検討してよい局面。"
      },
      cash_starved_specialist: {
        meaning: "技術力は難易度を上回っているのに、資金体力が乏しい状態。技術はあるのに運転資金が続かず倒産リスクが高い。",
        implication: "技術投資の拡大より先に、資金繰り（前受金交渉・部分払い改善など）を優先すべき局面。"
      },
      deep_pockets_shallow_skills: {
        meaning: "技術力は難易度に届いていないが、資金体力はある状態。リトライや低ティアモデルの大量投入で当面は延命できる局面。",
        implication: "延命している間に技術力（モデルの質・体制）への根本的なてこ入れが必要な局面。"
      },
      exit_candidate: {
        meaning: "技術優位度・資金体力ともに低い状態。挽回の打ち手が乏しく、早期に契約打ち切りや倒産に至りやすい。",
        implication: "早期撤退・契約整理の検討、あるいは抜本的な立て直し投資の是非を判断すべき局面。"
      }
    };
    const quadrantColors = {
      dominant_leader: "#16a34a",
      cash_starved_specialist: "#f59e0b",
      deep_pockets_shallow_skills: "#2563eb",
      exit_candidate: "#dc2626"
    };
    const strategyColors = {
      conservative: "#8b5cf6",
      cost_optimal: "#14b8a6",
      adaptive: "#f97316"
    };

    const form = document.getElementById("sim-form");
    const summaryEl = document.getElementById("summary");
    const errorEl = document.getElementById("error");
    const quadrantLegendEl = document.getElementById("quadrant-legend");
    let scatterChart = null;
    let histChart = null;

    function formatStrategy(strategy) {
      return `${STRATEGY_LABEL_JA[strategy] || strategy} (${strategy})`;
    }

    function formatQuadrant(quadrant) {
      return `${QUADRANT_LABEL_JA[quadrant] || quadrant} (${quadrant})`;
    }

    function setDefaults() {
      for (const [key, value] of Object.entries(defaults)) {
        const el = form.elements[key];
        if (el) el.value = value;
      }
    }

    function numberValue(name, asInt = false) {
      const raw = form.elements[name].value;
      return asInt ? parseInt(raw, 10) : parseFloat(raw);
    }

    function buildPayload(compareStrategies) {
      return {
        params: {
          alpha: numberValue("alpha"),
          beta: numberValue("beta"),
          lam: numberValue("lam"),
          k1: numberValue("k1"),
          cost_curve_exponent: numberValue("cost_curve_exponent"),
          sigma_noise: numberValue("sigma_noise"),
          gamma: numberValue("gamma"),
          partial_pay: numberValue("partial_pay"),
          r_min: numberValue("r_min"),
          max_consecutive_failures: numberValue("max_consecutive_failures", true),
          difficulty_0: numberValue("difficulty_0"),
          funds_0: numberValue("funds_0"),
          difficulty_cap: numberValue("difficulty_cap"),
          budget_c0: numberValue("budget_c0"),
          budget_c1: numberValue("budget_c1"),
          max_rounds: numberValue("max_rounds", true),
          strategy: form.elements["strategy"].value
        },
        n_trials: numberValue("n_trials", true),
        base_seed: numberValue("base_seed", true),
        compare_strategies: compareStrategies
      };
    }

    function formatMetricValue(metricKey, value) {
      if (metricKey === "mean_survival_rounds" || metricKey === "mean_net_profit") {
        return Number(value).toFixed(2);
      }
      return Number(value).toFixed(4);
    }

    function showSummary(response) {
      summaryEl.innerHTML = "";
      Object.entries(response.aggregates).forEach(([strategy, stats]) => {
        const card = document.createElement("div");
        card.className = "strategy-card";
        card.dataset.strategy = strategy;

        const metricRows = Object.entries(METRIC_META)
          .map(([metricKey, meta]) => `
            <div class="metric-item">
              <div class="metric-label">${meta.label} <small>(${metricKey})</small></div>
              <div class="metric-value">${formatMetricValue(metricKey, stats[metricKey])}</div>
              <div class="metric-help">${meta.help}</div>
            </div>
          `)
          .join("");

        card.innerHTML = `
          <h3>${formatStrategy(strategy)}</h3>
          ${metricRows}
        `;
        summaryEl.appendChild(card);
      });
    }

    function renderQuadrantLegend() {
      quadrantLegendEl.innerHTML = "";
      Object.keys(QUADRANT_LABEL_JA).forEach((quadrant) => {
        const detail = QUADRANT_DETAILS[quadrant];
        const item = document.createElement("div");
        item.className = "quadrant-item";
        item.innerHTML = `
          <div class="quadrant-title"><span class="swatch" style="background:${quadrantColors[quadrant] || "#6b7280"}"></span>${formatQuadrant(quadrant)}</div>
          <div>${detail.meaning}</div>
          <div><strong>示唆:</strong> ${detail.implication}</div>
        `;
        quadrantLegendEl.appendChild(item);
      });
    }

    function drawScatter(response) {
      const grouped = {};
      response.plot_data.quadrant_points.forEach((point) => {
        grouped[point.strategy] = grouped[point.strategy] || [];
        grouped[point.strategy].push(point);
      });

      const keys = response.meta.compare_strategies ? strategyOrder : Object.keys(grouped);
      const datasets = keys
        .filter((k) => grouped[k] && grouped[k].length)
        .map((strategy) => ({
          label: formatStrategy(strategy),
          data: grouped[strategy].map((p) => ({
            x: p.x,
            y: p.y,
            quadrant: p.quadrant,
            seed: p.seed,
            strategy: p.strategy
          })),
          backgroundColor: strategyColors[strategy] || "#6b7280",
          pointBackgroundColor: grouped[strategy].map((p) => quadrantColors[p.quadrant] || "#6b7280"),
          pointRadius: 4
        }));

      if (scatterChart) scatterChart.destroy();
      scatterChart = new Chart(document.getElementById("scatter-chart"), {
        type: "scatter",
        data: { datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: "bottom" },
            tooltip: {
              callbacks: {
                label: (context) => {
                  const point = context.raw || {};
                  return [
                    `戦略: ${formatStrategy(point.strategy)}`,
                    `シード値: ${point.seed}`,
                    `技術優位度: ${Number(point.x).toFixed(2)}`,
                    `資金体力: ${Number(point.y).toFixed(2)}`,
                    `分類: ${formatQuadrant(point.quadrant)}`
                  ];
                }
              }
            }
          },
          scales: {
            x: { title: { display: true, text: "技術優位度" } },
            y: { title: { display: true, text: "資金体力" } }
          }
        }
      });
    }

    function buildHistogram(values, bins) {
      const min = Math.min(...values);
      const max = Math.max(...values);
      if (min === max) {
        return { labels: [String(min)], edges: [min, min + 1] };
      }
      const width = (max - min) / bins;
      const edges = Array.from({ length: bins + 1 }, (_, i) => min + i * width);
      const labels = Array.from(
        { length: bins },
        (_, i) => `${edges[i].toFixed(0)}-${edges[i + 1].toFixed(0)}`
      );
      return { labels, edges };
    }

    function drawHistogram(response) {
      const trialsByStrategy = {};
      response.per_trial.forEach((item) => {
        trialsByStrategy[item.strategy] = trialsByStrategy[item.strategy] || [];
        trialsByStrategy[item.strategy].push(item.survival_rounds);
      });

      const values = response.plot_data.survival_histogram.values;
      const bins = Math.max(5, Math.ceil(Math.log2(values.length) + 1));
      const { labels, edges } = buildHistogram(values, bins);
      const strategies = response.meta.compare_strategies ? strategyOrder : Object.keys(trialsByStrategy);

      const datasets = strategies
        .filter((strategy) => trialsByStrategy[strategy] && trialsByStrategy[strategy].length)
        .map((strategy) => {
          const counts = Array.from({ length: labels.length }, () => 0);
          trialsByStrategy[strategy].forEach((v) => {
            let idx = labels.length - 1;
            for (let i = 0; i < labels.length; i++) {
              if (v >= edges[i] && v < edges[i + 1]) {
                idx = i;
                break;
              }
            }
            counts[idx] += 1;
          });
          return {
            label: formatStrategy(strategy),
            data: counts,
            backgroundColor: strategyColors[strategy] || "#6b7280"
          };
        });

      if (histChart) histChart.destroy();
      histChart = new Chart(document.getElementById("hist-chart"), {
        type: "bar",
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: "bottom" } },
          scales: {
            x: { title: { display: true, text: "生存ラウンド数（区間）" } },
            y: { title: { display: true, text: "件数" }, beginAtZero: true }
          }
        }
      });
    }

    async function runSimulation(compareStrategies) {
      errorEl.textContent = "";
      const payload = buildPayload(compareStrategies);
      try {
        const res = await fetch("/api/simulate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const body = await res.json();
        if (!res.ok) {
          errorEl.textContent = JSON.stringify(body.detail ?? body, null, 2);
          return;
        }
        showSummary(body);
        drawScatter(body);
        drawHistogram(body);
      } catch (err) {
        errorEl.textContent = `リクエストに失敗しました: ${err}`;
      }
    }

    document.getElementById("baseline-btn").addEventListener("click", () => {
      setDefaults();
      errorEl.textContent = "";
      runSimulation(false);
    });
    document.getElementById("run-btn").addEventListener("click", () => runSimulation(false));
    document.getElementById("compare-btn").addEventListener("click", () => runSimulation(true));

    setDefaults();
    renderQuadrantLegend();
  </script>
</body>
</html>
