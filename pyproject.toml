[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "outsourcing-dev-sim"
version = "0.1.0"
description = "AI-agent simulation of outsourced software development (client A vs contractor B: technical capability x funding)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[tool.setuptools]
packages = ["outsourcing_sim"]
